services:
  notebook:
    image: temple-ds
    container_name: temple-ds-container
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sleep infinity

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: temple-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000"
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts